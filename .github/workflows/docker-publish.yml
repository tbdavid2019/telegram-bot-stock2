name: Build and Push Docker Image

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Identify checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python for release checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify bot startup and regression tests before publishing
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test*.py'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tbdavid2019/telegram-bot-stock2:latest
            tbdavid2019/telegram-bot-stock2:${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
